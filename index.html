<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CACP – Gestão de Linhas</title>
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--g:#019285;--g2:#02A596;--gd:#016D63;--gdd:#014B44;--gl:#E6F4F2;--gold:#E9AB22;--tx:#1B2625;--mu:#77787B;--bd:rgba(19,32,29,.09);
--sh:0 10px 30px rgba(1,62,56,.10),0 2px 8px rgba(1,62,56,.06);--okb:#DDF3EE;--okt:#016D63;--atb:#FBF1D6;--att:#8A6512;--erb:#FBEAEA;--ert:#B23A3A}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:#DCEEEB;color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.app{width:100%;max-width:480px;margin:0 auto;background:#fff;min-height:100vh;box-shadow:var(--sh)}
header{display:flex;align-items:center;padding:10px 14px 0;gap:10px}
.vale{display:flex;align-items:center;gap:6px;font-weight:800;letter-spacing:2px;color:var(--gd);font-size:13px}
.cacp{flex:1;text-align:center;font-weight:900;color:var(--g);font-size:28px;letter-spacing:1px;line-height:1}
.cacp small{display:block;font-size:10px;letter-spacing:.5px;color:var(--mu);font-weight:600;margin-top:2px}
.band{margin-top:10px;background:linear-gradient(90deg,var(--gdd),var(--gd));border-bottom:3px solid var(--gold);padding:10px 14px;text-align:right;font-weight:900;font-size:17px;color:#fff;letter-spacing:1px;text-transform:uppercase}
.list{padding:10px 8px;display:grid;gap:8px}
.row{position:relative;display:flex;flex-direction:column;align-items:stretch;gap:4px;background:#fff;border:1px solid var(--bd);border-radius:16px;padding:8px;box-shadow:var(--sh);cursor:pointer}
.row.sel{outline:2px solid var(--g);background:var(--gl)}
.badge{flex:none;width:58px;align-self:flex-start;text-align:center;background:linear-gradient(135deg,var(--g2),var(--gd));color:#fff;font-weight:800;border-radius:12px;padding:8px 0;font-size:15px}
.lane{position:relative;width:100%;height:52px;overflow:hidden;background:linear-gradient(180deg,#fff,var(--gl))}
.lane:before{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:repeating-linear-gradient(90deg,#7b6f66 0 5px,transparent 5px 12px),#cfd3d2}
.lane:after{content:"";position:absolute;left:0;right:0;bottom:5px;height:3px;background:linear-gradient(180deg,#d3d4d7,#6a6b6e);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.train{--h:24px;position:absolute;left:2px;bottom:8px;z-index:1;display:flex;will-change:transform}
.cw{position:relative;flex:none;display:block;margin-right:1px}.wh{position:absolute;transform:translate(-50%,-50%);display:block}.wh.wc{clip-path:inset(45% 0 0 0)}.train.nl .wh svg{animation:none}.wh svg{width:100%;height:100%;display:block;animation:spin var(--spin,.4s) linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.car{height:var(--h);width:auto;display:block;pointer-events:none;user-select:none}.tag{position:absolute;top:2px;left:50%;margin-left:-7px;width:14px;height:14px;border-radius:50%;background:var(--gold);color:var(--tx);border:2px solid var(--att);font-size:10px;line-height:11px;text-align:center}
.cw.m .car{filter:drop-shadow(0 0 5px var(--gold)) drop-shadow(0 0 3px var(--gold));animation:blink 1.1s ease-in-out infinite}
@keyframes blink{0%,100%{filter:drop-shadow(0 0 5px var(--gold)) drop-shadow(0 0 3px var(--gold))}50%{filter:drop-shadow(0 0 0 transparent) drop-shadow(0 0 0 transparent)}}
.cw.l .car{filter:drop-shadow(0 0 5px var(--g)) drop-shadow(0 0 3px var(--g2));animation:blinkg 1.1s ease-in-out infinite}
@keyframes blinkg{0%,100%{filter:drop-shadow(0 0 5px var(--g)) drop-shadow(0 0 3px var(--g2))}50%{filter:drop-shadow(0 0 0 transparent) drop-shadow(0 0 0 transparent)}}
.tag.tg{background:var(--g2);border-color:var(--gd);color:#fff}
.row,.tp,.primary,.w .pill{transition:transform .6s ease,box-shadow .6s ease,background .8s ease}
.row:active,.tp:active,.primary:active,.w .pill:active{transform:scale(.95)}
.press{animation:press 1.2s ease-in-out}
@keyframes press{0%{transform:scale(1);box-shadow:0 0 0 0 rgba(1,146,133,.35)}35%{transform:scale(.94);box-shadow:0 0 0 6px rgba(1,146,133,.25)}70%{transform:scale(1.03);box-shadow:0 0 0 10px rgba(1,146,133,0)}100%{transform:scale(1);box-shadow:0 0 0 0 rgba(1,146,133,0)}}
@media (prefers-reduced-motion:reduce){.press{animation:none}}
.md{position:fixed;inset:0;background:rgba(1,75,68,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}.md[hidden]{display:none}
.box{background:#fff;border-radius:18px;box-shadow:var(--sh);width:100%;max-width:320px;overflow:hidden;padding-bottom:4px}
.box label{display:block;font-size:12px;font-weight:700;color:var(--mu);margin:10px 12px 4px}
.box input,.box select{display:block;width:calc(100% - 24px);margin:0 12px;padding:10px;border:1px solid var(--bd);border-radius:10px;font:inherit;font-size:16px;background:#fff;color:var(--tx)}
.acts{display:flex;gap:8px;padding:14px 12px 10px}.acts .btn{flex:1;margin:0;padding:11px 0}.ghost{background:#fff;color:var(--gd);border:1.5px solid var(--g)}
.rm{border:0;background:var(--erb);color:var(--ert);border-radius:99px;width:26px;height:26px;cursor:pointer;font-weight:800;flex:none}
.no{position:absolute;bottom:100%;left:0;right:0;margin-bottom:1px;text-align:center;font-size:9px;line-height:11px;font-weight:800;color:var(--gd);text-decoration:none;white-space:nowrap;overflow:hidden}
.mvb{border:0;background:var(--gl);color:var(--gd);border-radius:99px;width:26px;height:26px;cursor:pointer;font-weight:800;flex:none}
.rmbtn{background:var(--erb);color:var(--ert)}.btn[hidden]{display:none}
#sync{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;font-size:11px;font-weight:700;color:var(--gd);padding:8px 14px 0}
#rf{flex:none;border:1.5px solid var(--g);background:#fff;color:var(--gd);border-radius:99px;padding:6px 12px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit}#rf:disabled{opacity:.6}.ro #reset,.ro .mvb{display:none}.ro .w .pill{pointer-events:none}
.ud{border:0;background:var(--gl);color:var(--gd);border-radius:8px;width:24px;height:26px;cursor:pointer;font-weight:800;font-size:11px;flex:none;padding:0}.ud:disabled{opacity:.25;cursor:default}
.w{gap:6px}
.kps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 8px}.kp{background:#fff;border:1px solid var(--bd);border-radius:16px;box-shadow:var(--sh);padding:10px 4px;text-align:center}.kp b{display:block;font-size:22px;color:var(--gd)}.kp span{font-size:11px;color:var(--mu);font-weight:700}
#dash .card{margin:10px 8px}.dl{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--bd);font-size:12px}.dl b{width:40px;color:var(--gd)}.dl span{width:64px;text-align:right;color:var(--mu)}.bar{flex:1;height:14px;border-radius:99px;background:#EEF2F1;overflow:hidden;display:flex}.bar i{display:block;height:100%}.bar .g{background:var(--g)}.bar .y{background:var(--gold)}.bar .z{background:#b7bcbb}
#btns{display:flex;gap:6px}#dbd{border:1.5px solid var(--g);background:var(--g);color:#fff;border-radius:99px;padding:6px 12px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit}
h2:after{content:"";display:block;width:36px;height:3px;border-radius:3px;background:var(--gold);margin:6px auto 0}
.verify{background:linear-gradient(180deg,var(--gl),#CCE6E2);padding:14px 10px 18px;border-top:1px solid var(--bd)}
.btn{border:0;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit}
.primary{background:linear-gradient(135deg,var(--g),var(--gd));box-shadow:0 4px 12px rgba(1,146,133,.3);color:#fff;padding:11px 20px;display:block;margin:0 auto;letter-spacing:.5px}
.primary:hover{filter:brightness(1.08)}
h2{text-align:center;font-size:16px;letter-spacing:3px;margin:16px 0 12px;color:#66686B}
.tps{display:flex;gap:6px;justify-content:space-between}
.tp{flex:1;background:#fff;color:var(--gd);border:1.5px solid var(--g);padding:12px 0;font-size:15px}
.tp.on{background:linear-gradient(135deg,var(--g),var(--gd));color:#fff;box-shadow:0 0 0 3px rgba(1,146,133,.25)}
.card{margin-top:14px;background:#fff;border-radius:18px;box-shadow:var(--sh);border:1px solid var(--bd);overflow:hidden}
.ch{background:linear-gradient(90deg,var(--gd),var(--gdd));color:#fff;text-transform:uppercase;font-weight:800;font-size:14px;letter-spacing:.8px;padding:13px 16px;display:flex;justify-content:space-between}
.sum{display:flex;gap:8px;padding:10px 12px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:5px 12px;font-size:13px;font-weight:700}
.ok{background:var(--okb);color:var(--okt)}.mt{background:var(--atb);color:var(--att)}.nn{background:#EEF2F1;color:var(--mu)}
.w{display:flex;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--bd)}
.w:nth-child(even){background:var(--gl)}
.w:hover{background:rgba(1,146,133,.10)}
.wi{flex:1;min-width:0}.wi b{font-size:16px}.wi div{font-size:13px;color:var(--mu);margin-top:2px}
.w .pill{border:0;cursor:pointer;font-family:inherit}
.hint{padding:10px 12px;font-size:11px;color:var(--mu);text-align:center}
.empty{padding:20px;text-align:center;color:var(--mu);font-size:13px}
</style>
</head>

  if(ex){const c=ex.c;if(ex.l!==to){ex.l.cars.forEach((x,i)=>{if(x.im===undefined)x.im=i});ex.l.cars=ex.l.cars.filter(x=>x!==c);to.cars.push(c)}Object.assign(c,{num,n:'Vagão '+num,t:t==='Locomotiva'?c.t:t,m,st:sv,obs})}

const of0=openForm,sv0=$('sv').onclick;
openForm=function(c){of0(c);const lo=!!c&&c.t==='Locomotiva';['ft'].forEach(i=>{$(i).style.display=lo?'none':'';document.querySelector('label[for='+i+']').style.display=lo?'none':''});$('fn').maxLength=lo?14:8;$('dl').hidden=!c;$('er').textContent='';$('dl').textContent='Excluir vagão';$('fn').placeholder=lo?'Ex.: DDM 4510':'Ex.: 4521';if(lo){$('mt').textContent='Identificar locomotiva';$('fn').value=c.num==='LOC'?'':c.num}const f0=c?find(x=>x.k===c.k):null;fillPos($('fl').value,c?c.k:null,f0?f0.l.cars.indexOf(f0.c):null);$('fp').style.display=$('lfp').style.display=lo?'none':''};
$('sv').onclick=()=>{const f=ek?find(x=>x.k===ek):null;if(f&&f.c.t==='Locomotiva'){const c=f.c,m=$('fs').value==='m',to=lines.find(x=>x.id===$('fl').value);if(to!==f.l){if(hl(to)){$('er').textContent='A '+to.id+' já tem locomotiva.';return}f.l.cars.forEach((x,i)=>{if(x.im===undefined)x.im=i});f.l.cars=f.l.cars.filter(x=>x!==c);to.cars.unshift(c);c.im=0}c.num=$('fn').value.trim()||'LOC';c.m=m;c.st=$('fs').value;c.obs=m?($('fo').value.trim()||'Em manutenção'):'';save();md.hidden=true;sel=to.id;render();run(to.id);return}sv0()};
$('dl').onclick=()=>{const b=$('dl');if(b.textContent!=='Toque de novo para excluir'){b.textContent='Toque de novo para excluir';return}const f=find(x=>x.k===ek);if(f){f.l.cars.forEach((x,i)=>{if(x.im===undefined)x.im=i});f.l.cars=f.l.cars.filter(x=>x!==f.c);sel=f.l.id;save();md.hidden=true;render()}};
$('ft').onchange=()=>{if($('ft').value==='Locomotiva'){const l=lines.find(x=>!hl(x));if(l)$('fl').value=l.id}};
function fillPos(lid,exK,cur){const l=lines.find(x=>x.id===lid);if(!l)return;const a=l.cars.filter(x=>x.k!==exK);const nm=c=>c.t==='Locomotiva'?'a locomotiva '+(c.num||'LOC'):'o vagão '+(c.num||c.n);let h='';if(!(a[0]&&a[0].t==='Locomotiva'))h+='<option value="0">No início</option>';a.forEach((c,j)=>{if(j<a.length-1)h+=`<option value="${j+1}">Após ${nm(c)}</option>`});h+=`<option value="${a.length}">No final da composição</option>`;$('fp').innerHTML=h;$('fp').value=String(cur==null?a.length:Math.min(cur,a.length))}

const sv1=$('sv').onclick;
$('sv').onclick=()=>{

const hl=L=>L.cars.some(c=>c.t==='Locomotiva');
const stOf=c=>c.st==='ok'?'l':c.st||(c.m?'m':c.extra?'n':'l');
const RAT=[476,411,395,370,346,322,343].map(w=>w/224);
function fit(){document.querySelectorAll('.lane').forEach(l=>{const L=lines.find(x=>x.id===l.closest('.row').dataset.id),sum=L.cars.reduce((a,c,i)=>a+RAT[c.im!==undefined?c.im:i],0),h=Math.min(22,Math.max(10,(l.clientWidth-6-L.cars.length)/sum));l.querySelector('.train').style.setProperty('--h',h+'px')})}
render();addEventListener('resize',fit);requestAnimationFrame(frame);
let DB=null,LAST=null,LOGC=null,ME='',DASH=false;
const SN={l:'Liberado',m:'Em manutenção',n:'Sem status'},esc=s=>String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function snapMap(){const m={};lines.forEach(l=>l.cars.forEach(c=>m[c.k]={l:l.id,s:stOf(c),n:c.t==='Locomotiva'?'Locomotiva'+(c.num&&c.num!=='LOC'?' '+c.num:''):'Vagão '+(c.num||String(c.n).replace('Vagão ',''))}));return m}
function diffLog(){const n=snapMap(),o=LAST;LAST=n;if(!o||!LOGC)return;const ev=[];for(const k in n){const a=n[k],b=o[k];if(!b)ev.push(a.n+' cadastrado na '+a.l);else{if(a.l!==b.l)ev.push(a.n+' movido da '+b.l+' para a '+a.l);if(a.s!==b.s)ev.push(a.n+' ('+a.l+'): '+SN[a.s])}}for(const k in o)if(!n[k])ev.push(o[k].n+' removido da '+o[k].l);ev.slice(0,10).forEach(t=>LOGC.add({t:Date.now(),text:t,who:ME}).catch(()=>{}))}
function toggleDash(){DASH=!DASH;document.getElementById('list').style.display=DASH?'none':'';document.querySelector('.verify').style.display=DASH?'none':'';document.getElementById('dash').style.display=DASH?'block':'none';document.getElementById('dbd').textContent=DASH?'← Linhas':'📊 Dashboard';if(DASH)drawDash()}
function drawDash(){
  const T=lines.flatMap(l=>l.cars.filter(c=>c.t!=='Locomotiva').map(c=>({l:l.id,c}))),cnt=s=>T.filter(x=>stOf(x.c)===s).length,sl=lines.filter(l=>!hl(l)).length,mt=T.filter(x=>stOf(x.c)==='m');
  const k=(n,t,cl)=>`<div class="kp ${cl||''}"><b>${n}</b><span>${t}</span></div>`;
  let h=`<div class="kps">${k(T.length,'Vagões')}${k(cnt('l'),'Liberados','ok')}${k(cnt('m'),'Em manutenção','mt')}${k(cnt('n'),'Sem status','nn')}${k(lines.length-sl,'Locomotivas')}${k(sl,'Linhas sem loco',sl?'mt':'')}</div>`;
  h+=`<div class="card"><div class="ch"><span>Situação por linha</span></div>`+lines.map(l=>{const w=l.cars.filter(c=>c.t!=='Locomotiva'),n=w.length||1,p=s=>w.filter(c=>stOf(c)===s).length*100/n;return `<div class="dl"><b>${l.id}</b><div class="bar"><i class="g" style="width:${p('l')}%"></i><i class="y" style="width:${p('m')}%"></i><i class="z" style="width:${p('n')}%"></i></div><span>${w.length} vag.${hl(l)?'':' 🚫'}</span></div>`}).join('')+`<div class="hint">verde: liberado · amarelo: manutenção · cinza: sem status · 🚫 sem locomotiva</div></div>`;
  h+=`<div class="card"><div class="ch"><span>Em manutenção</span><span>${mt.length}</span></div>`+(mt.length?mt.map(x=>`<div class="w"><div class="wi"><b>${esc(x.c.n)}</b><div>${x.l} · ${esc(x.c.t)}${x.c.obs?' · '+esc(x.c.obs):''}</div></div></div>`).join(''):'<div class="empty">Nenhum vagão em manutenção.</div>')+`</div>`;
  h+=`<div class="card"><div class="ch"><span>Atividade recente</span></div><div id="lg"><div class="empty">${LOGC?'Carregando…':'O histórico aparece no link compartilhado.'}</div></div></div>`;
  document.getElementById('dash').innerHTML=h;
  if(LOGC)LOGC.orderBy('t','desc').limit(10).get().then(s=>{const e=document.getElementById('lg');if(!e)return;e.innerHTML=s.docs.length?s.docs.map(d=>d.data()).map(x=>`<div class="w"><div class="wi"><b>${esc(x.text)}</b><div>${esc(x.who||'')}${x.who?' · ':''}${new Date(x.t).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</div></div></div>`).join(''):'<div class="empty">Nenhuma atividade ainda.</div>'}).catch(()=>{})
}
function setSync(t){let e=document.getElementById('syncT');if(!e){document.querySelector('.band').insertAdjacentHTML('afterend','<div id="sync"><span id="syncT"></span><span id="btns"><button id="dbd" type="button">📊 Dashboard</button><button id="rf" type="button">⟳ Atualizar</button></span></div>');e=document.getElementById('syncT');document.getElementById('rf').onclick=refreshDb;document.getElementById('dbd').onclick=toggleDash}e.textContent=t}
async function refreshDb(){if(!DB){location.reload();return}const b=document.getElementById('rf');b.disabled=true;b.textContent='⟳ Atualizando…';try{const s=await DB.get();if(s.exists){const raw=s.data().lines,v=JSON.parse(raw);if(Array.isArray(v)&&v.length===lines.length&&raw!==JSON.stringify(lines.map(l=>l.cars))){lines.forEach((l,i)=>{if(Array.isArray(v[i]))l.cars=v[i]});try{localStorage.setItem('cacp-v2',raw)}catch(e){}render();LAST=snapMap();if(DASH)drawDash()}}}catch(e){}b.disabled=false;b.textContent='✔ Atualizado';setTimeout(()=>{b.textContent='⟳ Atualizar'},1500)}
function pushDb(){if(!DB)return;diffLog();DB.set({lines:JSON.stringify(lines.map(l=>l.cars)),ts:Date.now()}).catch(e=>{if(e&&e.code==='invalid_argument'){document.body.classList.add('ro');setSync('👁 Somente visualização')}})}
setSync('Dados salvos neste aparelho');
(async()=>{try{
  if(!window.claude||!claude.use)return;
  const db=await claude.use('db');if(!db)return;
  const user=await claude.use('user');
  const can=user?await user.can('data.write'):null,own=user?await user.isOwner():false;
  DB=db.doc('app/state');LAST=snapMap();
  if(can===false){document.body.classList.add('ro');setSync('👁 Somente visualização')}else setSync('● Compartilhado ao vivo');
  DB.onSnapshot(s=>{
    if(s.metadata&&s.metadata.hasPendingWrites)return;
    if(s.exists){try{const v=JSON.parse(s.data().lines);if(Array.isArray(v)&&v.length===lines.length&&s.data().lines!==JSON.stringify(lines.map(l=>l.cars))){lines.forEach((l,i)=>{if(Array.isArray(v[i]))l.cars=v[i]});try{localStorage.setItem('cacp-v2',JSON.stringify(v))}catch(e){}render();LAST=snapMap();if(DASH)drawDash();setSync('🔄 Atualizado por outra pessoa');clearTimeout(window._st);window._st=setTimeout(()=>setSync(can===false?'👁 Somente visualização':'● Compartilhado ao vivo'),4000)}}catch(e){}}
    else if(own&&can!==false)pushDb();
  },()=>{});
}catch(e){}})();
